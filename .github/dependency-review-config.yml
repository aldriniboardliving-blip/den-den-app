# .github/dependency-review-config.yml
# Configuration for dependency-review-action

# Fail on vulnerabilities of this severity or higher
fail-on-severity: high

# Allow specific vulnerabilities by GHSA ID
# allow-ghsas:
#   - GHSA-xxxx-xxxx-xxxx

# Allow specific scopes
# allowed-scopes:
#   - test
#   - development

# Block licenses
# deny-licenses:
#   - GPL-3.0-only