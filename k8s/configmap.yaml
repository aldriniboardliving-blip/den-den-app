apiVersion: v1
kind: ConfigMap
metadata:
  name: den-den-config
  namespace: den-den
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  DB_POOL_MAX: "20"
  JWT_ACCESS_EXPIRES: "15m"
  JWT_REFRESH_EXPIRES: "30d"
  OTP_PROVIDER: "twilio"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  ENABLE_CERT_PINNING: "true"