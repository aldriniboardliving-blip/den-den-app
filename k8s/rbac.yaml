apiVersion: v1
kind: ServiceAccount
metadata:
  name: den-den-backend
  namespace: den-den
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: den-den-backend
  namespace: den-den
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: den-den-backend
  namespace: den-den
subjects:
  - kind: ServiceAccount
    name: den-den-backend
    namespace: den-den
roleRef:
  kind: Role
  name: den-den-backend
  apiGroup: rbac.authorization.k8s.io